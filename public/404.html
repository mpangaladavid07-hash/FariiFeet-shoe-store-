<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Fariifeet Shoe Store</title>
    <!-- Inline styles on purpose: this file is served when a static asset is
         missing (see netlify.toml), so it must not depend on /assets/*.css. -->
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #faf7f4;
        color: #18110d;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 30rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
        color: #5b4c44;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.5rem, 5vw, 2rem);
        letter-spacing: -0.01em;
      }
      a {
        display: inline-block;
        padding: 0.85rem 1.6rem;
        border-radius: 999px;
        background: #18110d;
        color: #faf7f4;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #c89f9c;
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #18110d;
          color: #f5eee9;
        }
        p {
          color: #cbbdb4;
        }
        a {
          background: #f5eee9;
          color: #18110d;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>We couldn't find that page</h1>
      <p>
        The link may be old, or the file has moved. Browse the shop to see
        today's shoes.
      </p>
      <a href="/">Back to the shop</a>
    </main>
  </body>
</html>
