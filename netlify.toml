# Netlify build settings for the Fariifeet Shoe Store storefront.
#
# Secrets are deliberately NOT stored here: the Supabase keys, the optional
# FeedFusion keys and the Instagram tokens live in the Netlify dashboard (Site
# configuration -> Environment variables), scoped to the build or the functions.
# The order-desk PIN has a shop default in `src/lib/config.js` and can be rotated
# with `VITE_ADMIN_PIN` in the dashboard, no code change needed.
# See README -> "Deploying to Netlify".
#
# The Instagram importer additionally needs server-only variables (see README ->
# "Instagram -> catalogue"): SUPABASE_SERVICE_ROLE_KEY, INSTAGRAM_ACCESS_TOKEN,
# INSTAGRAM_USER_ID and INSTAGRAM_SYNC_SECRET. They are scoped to Functions and
# never reach the browser bundle.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # The project URL is public: Vite inlines VITE_SUPABASE_URL into the bundle on
  # purpose (see src/lib/config.js), so the same string in SUPABASE_URL tripped
  # Netlify's secret scanner and failed the deploy. Omitting that one key keeps
  # the scan on for real secrets (SUPABASE_SERVICE_ROLE_KEY, INSTAGRAM_* …).
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# Serverless functions (Instagram -> catalogue importer). Shared code lives in
# netlify/lib/, outside this directory, so only real endpoints get deployed.
[functions]
  directory = "netlify/functions"

# 04:00 UTC = 07:00 in Dar es Salaam, before the shop opens.
[functions."instagram-sync-scheduled"]
  schedule = "0 4 * * *"

# Pretty URL for the importer. Must come before the single-page-app catch-all.
[[redirects]]
  from = "/api/instagram-sync"
  to = "/.netlify/functions/instagram-sync"
  status = 200

# Static files must never be answered with index.html. Netlify already serves a
# file that exists before any rewrite (these rules have no `force`), but a
# *missing* asset — e.g. a hashed /assets/*.css left over in a cached page after
# a redeploy — would otherwise fall through to the SPA rule and come back as
# HTML with status 200. Browsers refuse a stylesheet with the wrong MIME type,
# so the whole page renders unstyled. A real 404 makes that obvious instead.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/images/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/shoes/*"
  to = "/404.html"
  status = 404

# Single-page app: unknown paths are served index.html (status 200) so the
# client-side /admin order desk loads when opened or refreshed directly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed bundles are immutable, so cache them hard. index.html must always
# revalidate, otherwise a browser can keep HTML that points at a CSS hash the
# new deploy no longer publishes (the unstyled-page failure described above).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

