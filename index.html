<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/fariifeet-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF7F4" />
    <meta
      name="description"
      content="Fariifeet Shoe Store — a retail shoe shop in Kariakoo, Mtaa wa DDC, 1st Floor, Room No. 76, Dar es Salaam. Different shoe designs for women and kids: sneakers, heels, slides and new drops, with same-day delivery in Dar and countrywide shipping across Tanzania."
    />
    <meta property="og:title" content="Fariifeet Shoe Store — Retail shoes in Kariakoo" />
    <meta
      property="og:description"
      content="Different shoe designs at our retail shop in Kariakoo, Dar es Salaam. Sneakers, heels, slides and kids' pairs with same-day delivery in Dar and nationwide shipping."
    />
    <meta property="og:image" content="/images/fariifeet-hero-shoes.jpg" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so there is no white/dark flash.
      (function () {
        try {
          var stored = window.localStorage.getItem('fariifeet-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored ? stored === 'dark' : prefersDark
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#18110D' : '#FAF7F4')
        } catch (error) {
          /* first paint still works without a stored theme */
        }
      })()
    </script>
    <title>Fariifeet Shoe Store — Retail shoes in Kariakoo, Dar es Salaam</title>
  </head>
  <body class="bg-shell">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
